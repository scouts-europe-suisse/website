name: Bug
description: Quelque chose ne marche pas (lien mort, page vide, erreur, affichage cassé).
title: "[Bug] "
labels: ["type: bug", "état: à trier"]
body:
  - type: input
    id: page
    attributes:
      label: Adresse de la page
      placeholder: https://scouts-europe-suisse.github.io/website/fr/…
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Ce que vous avez fait
      description: Les étapes pour reproduire, dans l'ordre.
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: constate
    attributes:
      label: Ce qui se passe réellement
      description: Une capture d'écran si possible.
    validations:
      required: true
  - type: input
    id: environnement
    attributes:
      label: Appareil et navigateur
      placeholder: iPhone, Safari / Windows, Chrome…
